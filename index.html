<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LanguageTester — проверь свой уровень</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
</head>
<body>
  <header>
  <div class="container header-inner">
    <a href="index.html" class="logo">🌍 LanguageTester</a>
    <nav>
      <a href="index.html">Главная</a>
      <a href="login.html" id="login-link">Вход для преподавателя</a>
      <button id="theme-toggle" class="theme-toggle" title="Сменить тему">🌙</button>
    </nav>
  </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Проверь свой уровень английского и испанского</h1>
      <p>Выберите тест, введите имя — и узнайте результат за 15 минут.</p>
    </section>

    <section class="name-input">
      <label for="student-name">Ваше имя (для преподавателя):</label>
      <input type="text" id="student-name" placeholder="Иван Иванов" required>
    </section>

    <section class="filters">
      <select id="filter-lang">
        <option value="">Все языки</option>
        <option value="english">English</option>
        <option value="spanish">Español</option>
      </select>
      <select id="filter-level">
        <option value="">Все уровни</option>
        <option value="a2">A2</option>
        <option value="b1">B1</option>
      </select>
    </section>

    <section id="tests-list" class="languages">
      <p class="muted">Загрузка тестов...</p>
    </section>

  </main>

  <footer>
    <div class="container">
      <p>© 2026 LanguageTester — курсовой проект</p>
    </div>
  </footer>
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
