<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LangTest — проверь свой уровень</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">🌍 LangTest</a>
      <nav>
        <a href="index.html">Главная</a>
        <a href="login.html" id="login-link">Вход для преподавателя</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Проверь свой уровень английского и испанского</h1>
      <p>Бесплатные тесты по уровням A2 и B1. Результат — за 15 минут.</p>
    </section>

    <section class="name-input">
      <label for="student-name">Ваше имя (для преподавателя):</label>
      <input type="text" id="student-name" placeholder="Иван Иванов" required>
    </section>

    <section class="languages">
      <div class="lang-card">
        <div class="flag">🇬🇧</div>
        <h2>English</h2>
        <button onclick="startTest('english','a2')" class="btn">A2 — Elementary</button>
        <button onclick="startTest('english','b1')" class="btn btn-secondary">B1 — Intermediate</button>
      </div>

      <div class="lang-card">
        <div class="flag">🇪🇸</div>
        <h2>Español</h2>
        <button onclick="startTest('spanish','a2')" class="btn">A2 — Elemental</button>
        <button onclick="startTest('spanish','b1')" class="btn btn-secondary">B1 — Intermedio</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>© 2025 LangTest — курсовой проект</p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
