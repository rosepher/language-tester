<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тесты — LanguageTester</title>
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="dashboard.html" class="logo">🌍 LanguageTester — панель</a>
      <nav>
        <a href="dashboard.html">← Назад</a>
        <button id="logout-btn" class="btn-link">Выйти</button>
        <button id="theme-toggle" class="theme-toggle" title="Сменить тему">🌙</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Управление тестами</h1>

    <div class="filters">
      <select id="filter-lang">
        <option value="">Все языки</option>
        <option value="english">English</option>
        <option value="spanish">Español</option>
      </select>
      <select id="filter-level">
        <option value="">Все уровни</option>
        <option value="a2">A2</option>
        <option value="b1">B1</option>
      </select>
      <button id="add-btn" class="btn">+ Добавить тест</button>
    </div>

    <div id="form-container" style="display:none;" class="form-container">
      <h2 id="form-title">Новый тест</h2>
      <form id="test-form">
        <input type="hidden" id="t-id">

        <label>Название теста</label>
        <input type="text" id="t-title" required placeholder="Например: English A2 — Basics">

        <label>Описание</label>
        <textarea id="t-description" placeholder="Краткое описание теста"></textarea>

        <label>Язык</label>
        <select id="t-lang" required>
          <option value="english">English</option>
          <option value="spanish">Español</option>
        </select>

        <label>Уровень</label>
        <select id="t-level" required>
          <option value="a2">A2</option>
          <option value="b1">B1</option>
        </select>

        <label>
          <input type="checkbox" id="t-published" checked>
          Опубликован (виден ученикам)
        </label>


        <div class="form-actions">
          <button type="submit" class="btn">Сохранить</button>
          <button type="button" id="cancel-btn" class="btn btn-secondary">Отмена</button>
        </div>
        <p id="form-error" class="error"></p>
      </form>
    </div>

    <div id="tests-list" class="questions-list">Загрузка...</div>
  </main>
  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/teacher.js"></script>
  <script type="module" src="../js/tests.js"></script>
</body>
</html>
